name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution utile par branche : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité et build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Vérification du formatage
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
