# PostgreSQL local pour le développement (DEC-007).
#
# La version majeure doit rester alignée sur celle du projet Supabase, sinon un
# comportement validé en local peut différer en production.
#
#   docker compose up -d      démarrer
#   docker compose down       arrêter, en conservant les données
#   docker compose down -v    arrêter ET supprimer les données

services:
  postgres:
    image: postgres:17-alpine
    container_name: simandou-immo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: simandou
      POSTGRES_PASSWORD: simandou
      POSTGRES_DB: simandou_immo
      # Force une comparaison de chaînes déterministe, indépendante de la
      # locale de la machine hôte.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simandou -d simandou_immo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
